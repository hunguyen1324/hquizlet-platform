# HQuizlet Platform – Docker Compose (Phase 2)
# Chạy: docker compose -f infra/docker/docker-compose.yml up --build
# Dev 5 – [P2-INT-03]

services:
  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args: { SERVICE: gateway }
    environment:
      PORT: "8080"
      AUTH_SERVICE_URL: http://auth:8081
      STUDY_SERVICE_URL: http://study:8082
      QUIZ_SERVICE_URL: http://quiz:8083
    ports: ["8080:8080"]
    depends_on:
      auth: { condition: service_healthy }
      study: { condition: service_healthy }
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args: { SERVICE: auth }
    ports: ["8081:8081"]
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://hquizlet:hquizlet@postgres:5432/hquizlet?sslmode=disable
      SESSION_TTL: "3600"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-prod}"
    depends_on:
      postgres: { condition: service_healthy }
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  study:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args: { SERVICE: study }
    ports: ["8082:8082"]
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://hquizlet:hquizlet@postgres:5432/hquizlet?sslmode=disable
      AUTH_SERVICE_URL: http://auth:8081
    depends_on:
      postgres: { condition: service_healthy }
      auth: { condition: service_healthy }
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  quiz:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args: { SERVICE: quiz }
    ports: ["8083:8083"]
    environment:
      PORT: "8083"
      DATABASE_URL: postgres://hquizlet:hquizlet@postgres:5432/hquizlet?sslmode=disable
      AUTH_SERVICE_URL: http://auth:8081
    depends_on:
      postgres: { condition: service_healthy }
      auth: { condition: service_healthy }
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      VITE_GATEWAY_URL: http://localhost:8080
    ports: ["5173:5173"]
    volumes:
      - ../../apps/web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      gateway: { condition: service_healthy }
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hquizlet
      POSTGRES_USER: hquizlet
      POSTGRES_PASSWORD: hquizlet
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hquizlet -d hquizlet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    ports: ["4222:4222", "8222:8222"]
    restart: unless-stopped

volumes:
  postgres-data:
  web-node-modules:
