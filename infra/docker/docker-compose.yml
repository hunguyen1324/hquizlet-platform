# HQuizlet Platform – Docker Compose (Phase 6)
# Chạy: docker compose -f infra/docker/docker-compose.yml up --build
# Dev 2 - [P6-DB-01, P6-NATS-01]

services:
  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: gateway
    environment:
      PORT: "8080"
      AUTH_SERVICE_URL: "${AUTH_SERVICE_URL:-http://auth:8081}"
      STUDY_SERVICE_URL: "${STUDY_SERVICE_URL:-http://study:8082}"
      QUIZ_SERVICE_URL: "${QUIZ_SERVICE_URL:-http:8083}"
      CLASS_SERVICE_URL: "${CLASS_SERVICE_URL:-http://class:8084}"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth:
        condition: service_healthy
      study:
        condition: service_healthy
      quiz:
        condition: service_healthy
      class:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: auth
    environment:
      PORT: "8081"
      DATABASE_URL: "${DATABASE_URL:-postgres://hquizlet:hquizlet@postgres:5432/hquizlet?sslmode=disable}"
      SESSION_TTL: "${SESSION_TTL:-1h}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-prod}"
    ports:
      - "${AUTH_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  study:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: study
    environment:
      PORT: "8082"
      DATABASE_URL: "${DATABASE_URL:-postgres://hquizlet:hquizlet@postgres:5432/hquizlet?sslmode=disable}"
      AUTH_SERVICE_URL: "${AUTH_SERVICE_URL:-http://auth:8081}"
    ports:
      - "${STUDY_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  quiz:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: quiz
    environment:
      PORT: "8083"
      DATABASE_URL: "${DATABASE_URL:-postgres://hquizlet:hquizlet@postgres:5432/hquizlet?sslmode=disable}"
      AUTH_SERVICE_URL: "${AUTH_SERVICE_URL:-http://auth:8081}"
      STUDY_SERVICE_URL: "${STUDY_SERVICE_URL:-http://study:8082}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      NATS_URL: "${NATS_URL:-nats://nats:4222}"
    ports:
      - "${QUIZ_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      VITE_GATEWAY_URL: "${VITE_GATEWAY_URL:-http://localhost:8080}"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ../../apps/web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      gateway:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-hquizlet}"
      POSTGRES_USER: "${POSTGRES_USER:-hquizlet}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-hquizlet}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-hquizlet} -d ${POSTGRES_DB:-hquizlet}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  class:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: class
    environment:
      PORT: "8084"
      DATABASE_URL: "${DATABASE_URL:-postgres://hquizlet:hquizlet@postgres:5432/hquizlet?sslmode=disable}"
      AUTH_SERVICE_URL: "${AUTH_SERVICE_URL:-http://auth:8081}"
      STUDY_SERVICE_URL: "${STUDY_SERVICE_URL:-http://study:8082}"
      NATS_URL: "${NATS_URL:-nats://nats:4222}"
      CLASS_INTERNAL_TOKEN: "${CLASS_INTERNAL_TOKEN:-dev-internal-token}"
    ports:
      - "${CLASS_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
      nats:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nats:
    image: nats:2-alpine
    command: ["-js", "--store_dir", "/data", "-m", "8222"]
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
  web-node-modules:
  nats-data:
