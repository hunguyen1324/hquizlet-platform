services:
  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: gateway
    environment:
      AUTH_SERVICE_URL: http://auth:8081
      STUDY_SERVICE_URL: http://study:8082
      QUIZ_SERVICE_URL: http://quiz:8083
    ports:
      - "8080:8080"
    volumes:
      - ../../services/gateway:/src/services/gateway
    depends_on:
      - auth
      - study
      - quiz

  auth:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: auth
    ports:
      - "8081:8081"
    volumes:
      - ../../services/auth:/src/services/auth

  study:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: study
    ports:
      - "8082:8082"
    volumes:
      - ../../services/study:/src/services/study

  quiz:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: quiz
    ports:
      - "8083:8083"
    volumes:
      - ../../services/quiz:/src/services/quiz

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      VITE_GATEWAY_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - ../../apps/web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - gateway

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hquizlet
      POSTGRES_USER: hquizlet
      POSTGRES_PASSWORD: hquizlet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  postgres-data:
  web-node-modules:
