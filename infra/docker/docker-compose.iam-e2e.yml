# Isolated IAM test stack. No production environment interpolation or host database ports.
services:
  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: gateway
    environment:
      PORT: '8080'
      AUTH_SERVICE_URL: http://auth:8081
      STUDY_SERVICE_URL: http://study:8082
      QUIZ_SERVICE_URL: http://quiz:8083
      CLASS_SERVICE_URL: http://class:8084
      PAYMENT_SERVICE_URL: http://payment:8085
      FILE_SERVICE_URL: http://file:8086
      INTERNAL_SIGNING_KEY: iam-e2e-only-signing-key
    expose:
    - '8080'
    depends_on:
      auth:
        condition: service_healthy
      study:
        condition: service_healthy
      quiz:
        condition: service_healthy
      class:
        condition: service_healthy
      payment:
        condition: service_healthy
      file:
        condition: service_healthy
    restart: 'no'
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8080/healthz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
    - 127.0.0.1:18080:8080
  auth:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: auth
    environment:
      PORT: '8081'
      DATABASE_URL: postgres://hquizlet:hquizlet@postgres:5432/hquizlet?sslmode=disable
      SESSION_TTL: 1h
      JWT_SECRET: dev-secret-change-in-prod
      INTERNAL_SIGNING_KEY: iam-e2e-only-signing-key
    expose:
    - '8081'
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8081/healthz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  study:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: study
    environment:
      NATS_URL: nats://nats:4222
      PORT: '8082'
      PAYMENT_SERVICE_URL: http://payment:8085
      QUIZ_AUDIO_ALLOWED_HOSTS: ''
      DATABASE_URL: postgres://hquizlet:hquizlet@postgres:5432/hquizlet?sslmode=disable
      AUTH_SERVICE_URL: http://auth:8081
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_IMPORT_BUCKET: hquizlet-imports
      INTERNAL_SIGNING_KEY: iam-e2e-only-signing-key
    expose:
    - '8082'
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: 'no'
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8082/healthz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  quiz:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: quiz
    environment:
      CLASS_SERVICE_URL: http://class:8084
      PORT: '8083'
      DATABASE_URL: postgres://hquizlet:hquizlet@postgres:5432/hquizlet?sslmode=disable
      AUTH_SERVICE_URL: http://auth:8081
      STUDY_SERVICE_URL: http://study:8082
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      INTERNAL_SIGNING_KEY: iam-e2e-only-signing-key
    expose:
    - '8083'
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: 'no'
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8083/readyz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  class:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: class
    environment:
      PORT: '8084'
      DATABASE_URL: postgres://hquizlet:hquizlet@postgres:5432/hquizlet?sslmode=disable
      AUTH_SERVICE_URL: http://auth:8081
      STUDY_SERVICE_URL: http://study:8082
      NATS_URL: nats://nats:4222
      CLASS_INTERNAL_TOKEN: dev-internal-token
      INTERNAL_SIGNING_KEY: iam-e2e-only-signing-key
    expose:
    - '8084'
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
      nats:
        condition: service_started
    restart: 'no'
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8084/healthz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  payment:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: payment
    env_file:
    - path: ../../.env
      required: false
    environment:
      PORT: '8085'
      DATABASE_URL: postgres://hquizlet:hquizlet@postgres:5432/hquizlet?sslmode=disable
      STUDY_SERVICE_URL: http://study:8082
      AUTH_SERVICE_URL: http://auth:8081
      ADMIN_TOKEN: dev-admin-token
      SEPAY_API_TOKEN: ''
      SEPAY_BIDV_BANK_ACCOUNT_ID: ''
      SEPAY_WEBHOOK_API_KEY: ''
      INTERNAL_SIGNING_KEY: iam-e2e-only-signing-key
    expose:
    - '8085'
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    restart: 'no'
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8085/healthz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  file:
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: file
    environment:
      PORT: '8086'
      DATABASE_URL: postgres://hquizlet:hquizlet@postgres:5432/hquizlet?sslmode=disable
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: hquizlet
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_PUBLIC_BASE_URL: http://localhost/files
      STORAGE_REGION: us-east-1
      STORAGE_PATH_STYLE: 'true'
      STORAGE_PRESIGN_TTL_MINS: '15'
      INTERNAL_SIGNING_KEY: iam-e2e-only-signing-key
    expose:
    - '8086'
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: 'no'
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8086/healthz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hquizlet
      POSTGRES_USER: hquizlet
      POSTGRES_PASSWORD: hquizlet
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U hquizlet -d hquizlet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: 'no'
  redis:
    image: redis:7-alpine
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 3
    restart: 'no'
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    expose:
    - '9000'
    volumes:
    - minio-data:/data
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 10s
      timeout: 5s
      retries: 5
    restart: 'no'
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: "/bin/sh -c \"\n  mc alias set local http://minio:9000 minioadmin\
      \ minioadmin &&\n  mc mb --ignore-existing local/hquizlet &&\n  mc anonymous\
      \ set download local/hquizlet &&\n  mc mb --ignore-existing local/hquizlet-imports\
      \ &&\n  mc ilm rule add --expire-days 1 local/hquizlet-imports --prefix imports/\
      \ || true\n\"\n"
    restart: 'no'
  nats:
    image: nats:2-alpine
    command:
    - -js
    - --store_dir
    - /data
    - -m
    - '8222'
    volumes:
    - nats-data:/data
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8222/healthz
      interval: 10s
      timeout: 5s
      retries: 3
    restart: 'no'
volumes:
  postgres-data: null
  nats-data: null
  minio-data: null
