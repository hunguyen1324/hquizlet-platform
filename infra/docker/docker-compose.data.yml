# HQuizlet Platform – DATA LAYER (chạy trên server "Data")
# Gồm: PostgreSQL, Redis, NATS, MinIO
#
# Chạy: docker compose -f infra/docker/docker-compose.data.yml up -d
#
# QUAN TRỌNG VỀ MẠNG:
#   Các port DB/cache/broker CHỈ bind vào địa chỉ IPv6 riêng của server Data
#   qua biến DATA_BIND_IP, không expose ra 0.0.0.0 để tránh lộ ra internet.
#   Đặt DATA_BIND_IP=[2001:xxxx::xxxx] (địa chỉ IPv6 của chính server Data,
#   PHẢI có dấu ngoặc vuông) trong .env. Ngoài ra vẫn phải bật ufw (xem
#   docs/deployment/DEPLOY.md) vì dải IPv6 này có thể route công khai.
#   Nếu để trống, mặc định bind ra tất cả interface (KHÔNG khuyến nghị cho prod).

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       "${POSTGRES_DB:-hquizlet}"
      POSTGRES_USER:     "${POSTGRES_USER:-hquizlet}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    ports:
      - "${DATA_BIND_IP:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hquizlet} -d ${POSTGRES_DB:-hquizlet}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "${DATA_BIND_IP:-0.0.0.0}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  minio:
    # minio/minio đã bị gỡ khỏi Docker Hub từ 23/10/2025 (MinIO ngừng phát hành
    # image miễn phí). Dùng image thay thế miễn phí từ Chainguard, build lại từ
    # mã nguồn MinIO. Dùng tag "-dev" (có busybox/wget) để healthcheck chạy được,
    # tag "latest" thường (distroless, không có shell) sẽ không healthcheck được.
    image: cgr.dev/chainguard/minio:latest-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     "${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}"
    ports:
      # API MinIO – app server (gateway/file service) gọi vào đây qua Tailscale
      - "${DATA_BIND_IP:-0.0.0.0}:9000:9000"
      # Console quản trị – nên chỉ mở khi cần, hoặc truy cập qua Tailscale/SSH tunnel
      - "${DATA_BIND_IP:-0.0.0.0}:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    # minio/mc cũng bị gỡ cùng đợt — dùng bản thay thế minio-client của Chainguard
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/${STORAGE_BUCKET:-hquizlet} &&
        mc anonymous set download local/${STORAGE_BUCKET:-hquizlet} &&
        mc mb --ignore-existing local/${MINIO_IMPORT_BUCKET:-hquizlet-imports} &&
        mc ilm rule add --expire-days 1 local/${MINIO_IMPORT_BUCKET:-hquizlet-imports} --prefix imports/ || true
      "
    restart: "no"

  nats:
    image: nats:2-alpine
    command: ["-js", "--store_dir", "/data", "-m", "8222"]
    ports:
      - "${DATA_BIND_IP:-0.0.0.0}:${NATS_CLIENT_PORT:-4222}:4222"
      - "${DATA_BIND_IP:-0.0.0.0}:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  nats-data:
