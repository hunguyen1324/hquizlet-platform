worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'upstream=$upstream_addr rt=$request_time';
  access_log /var/log/nginx/access.log main;

  sendfile        on;
  keepalive_timeout 65;
  client_max_body_size 50m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  proxy_cache_path /var/cache/nginx/files levels=1:2 keys_zone=files_cache:50m
                   max_size=1g inactive=7d use_temp_path=off;

  # ── Rate limiting (lớp thô, trước khi chạm gateway) ─────────────────────
  # Gateway vẫn là nơi quyết định ngưỡng theo route/user; nginx chỉ chặn lũ
  # request rẻ tiền để giảm tải. Ngưỡng ở đây rộng hơn gateway ~2-3 lần.
  limit_req_zone $binary_remote_addr zone=api_general:20m rate=30r/s;
  # 5r/s (không phải 5r/m) vì cả một lớp học/NAT có thể dùng chung một IP;
  # ngưỡng chính xác cho login nằm ở gateway (10/phút/IP).
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=api_conn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Real client IP: chỉ bật khi nginx nằm sau một proxy tin cậy (Cloudflare,
  # tunnel). Mở comment khối dưới và thay bằng dải IP của proxy đó; khi chạy
  # trực tiếp, để tắt để client không tự đặt IP cho limit_req.
  # real_ip_header CF-Connecting-IP;
  # real_ip_recursive on;
  # set_real_ip_from 173.245.48.0/20;
  # set_real_ip_from 103.21.244.0/22;
  # set_real_ip_from 104.16.0.0/13;
  # (xem đầy đủ tại https://www.cloudflare.com/ips/)

  upstream gateway {
    server gateway:8080;
    keepalive 32;
  }

  upstream minio {
    server minio:9000;
    keepalive 8;
  }

  server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # 429 của limit_req/limit_conn trả body JSON thay vì trang HTML mặc định.
    error_page 429 = @too_many_requests;

    # Đăng nhập / đăng ký / quên mật khẩu: ngưỡng chặt nhất ở tầng nginx.
    location /api/v1/auth/ {
      limit_req zone=api_auth burst=20 nodelay;
      rewrite ^/api/(.*) /$1 break;
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    location /api/ {
      limit_req zone=api_general burst=60 nodelay;
      rewrite ^/api/(.*) /$1 break;
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    # Private video uploads/streams: avoid buffering a second copy on the app disk.
    location ~ ^/api/v1/(classes/[0-9]+/videos/upload|class-video-stream|class-video-hls)$ {
      client_max_body_size 90m;
      rewrite ^/api/(.*) /$1 break;
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_cache off;
      proxy_connect_timeout 10s;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # SSE giữ kết nối lâu: giới hạn số kết nối đồng thời chứ không giới hạn
    # số request (mỗi lần reconnect là một request mới).
    location ~ ^/api/v1/live-sessions/[^/]+/events$ {
      limit_conn api_conn 100;
      rewrite ^/api/(.*) /$1 break;
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      add_header Cache-Control "no-cache";
      add_header X-Accel-Buffering "no";
    }

    location /files/ {
      rewrite ^/files/(.*) /hquizlet/$1 break;
      proxy_pass http://minio;
      proxy_http_version 1.1;
      proxy_set_header Host minio:9000;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 10s;
      proxy_read_timeout 60s;

      proxy_cache files_cache;
      proxy_cache_key $uri;
      proxy_cache_valid 200 7d;
      proxy_cache_lock on;
      proxy_cache_lock_timeout 5s;
      proxy_cache_background_update on;
      proxy_cache_use_stale error timeout updating;
      add_header X-Cache-Status $upstream_cache_status;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location /nginx-health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # 429 trả về cùng định dạng lỗi JSON như gateway để frontend hiển thị được.
    location @too_many_requests {
      default_type application/json;
      add_header Retry-After 60 always;
      return 429 '{"code":"RATE_LIMITED","message":"too many requests, please retry later","requestId":"","details":{"retryAfter":60}}';
    }
  }
}
