# hquizlet-platform – Nginx reverse proxy (dev, HTTP only)
# Entry point duy nhất: port 80
# Upstream nội bộ Docker không expose ra host nữa

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logging ──────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'upstream=$upstream_addr rt=$request_time';
  access_log /var/log/nginx/access.log main;

  # ── Cơ bản ───────────────────────────────────────────────────────────────
  sendfile        on;
  keepalive_timeout 65;
  client_max_body_size 50m;   # upload ảnh / file học liệu

  # ── Upstream pools ───────────────────────────────────────────────────────
  upstream gateway {
    server gateway:8080;
    keepalive 32;
  }

  upstream web {
    server web:5173;
    keepalive 16;
  }

  upstream minio {
    server minio:9000;
    keepalive 8;
  }

  # ── Server ───────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name localhost;

    # ── /api/* → Go Gateway ──────────────────────────────────────────────
    location /api/ {
      # strip /api prefix trước khi forward
      rewrite ^/api/(.*) /$1 break;

      proxy_pass http://gateway;
      proxy_http_version 1.1;

      # Header chuẩn
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";   # keepalive upstream

      # Timeout mặc định cho REST API
      proxy_connect_timeout 10s;
      proxy_send_timeout    30s;
      proxy_read_timeout    30s;
    }

    # ── /api/v1/live-sessions/*/events → SSE (Live Quiz) ─────────────────
    # Phải đặt TRƯỚC location /api/ vì nginx match theo độ dài cụ thể nhất
    location ~ ^/api/v1/live-sessions/[^/]+/events$ {
      rewrite ^/api/(.*) /$1 break;

      proxy_pass http://gateway;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";

      # SSE cần tắt buffering để client nhận event ngay lập tức
      proxy_buffering            off;
      proxy_cache                off;
      proxy_read_timeout         3600s;  # giữ kết nối SSE tối đa 1h
      proxy_send_timeout         3600s;

      # Báo browser đây là stream
      add_header Cache-Control   "no-cache";
      add_header X-Accel-Buffering "no";
    }

    # ── /files/* → MinIO (static assets, avatars) ────────────────────────
    location /files/ {
      rewrite ^/files/(.*) /hquizlet/$1 break;

      proxy_pass http://minio;
      proxy_http_version 1.1;

      proxy_set_header Host              minio:9000;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

      proxy_connect_timeout 10s;
      proxy_read_timeout    60s;

      # Cache file tĩnh tại nginx 7 ngày
      proxy_cache_valid 200 7d;
      add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ── /* → Vite dev server (SPA) ────────────────────────────────────────
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;

      # Vite HMR dùng WebSocket
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

      proxy_connect_timeout 10s;
      proxy_read_timeout    60s;
    }

    # ── Health check của nginx (dùng trong docker healthcheck) ───────────
    location /nginx-health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
