openapi: 3.1.0
info:
  title: HQuizlet Platform API
  version: 2.0.1
  description: |
    Phase 2 canonical API contract. Gateway is the public entrypoint.
    Dev5 owns contract alignment; backend implementations remain the source
    of runtime behavior until each endpoint is migrated to the contract.
servers:
  - url: http://localhost:8080
    description: Local gateway

tags:
  - name: health
  - name: auth
  - name: study-sets
  - name: flashcards
  - name: folders
  - name: learning

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        field: { type: string }
    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        image: { type: string }
        role: { type: string }
        createdAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      required: [authenticated, token, expiresAt, user]
      properties:
        authenticated: { type: boolean }
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    StudySet:
      type: object
      required: [id, userId, title, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        flashcards:
          type: array
          items: { $ref: '#/components/schemas/Flashcard' }
    Flashcard:
      type: object
      required: [id, studySetId, term, definition, starred, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        studySetId: { type: integer, format: int64 }
        term: { type: string }
        definition: { type: string }
        starred: { type: boolean }
        position: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StudySetListResult:
      type: object
      required: [items, total, page, perPage, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StudySet' }
        total: { type: integer }
        page: { type: integer }
        perPage: { type: integer }
        totalPages: { type: integer }
    BulkFlashcardItem:
      type: object
      required: [term, definition]
      properties:
        id: { type: integer, format: int64 }
        term: { type: string }
        definition: { type: string }
        position: { type: integer }
        delete: { type: boolean }
    BulkSaveFlashcardsRequest:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          items: { $ref: '#/components/schemas/BulkFlashcardItem' }
    BulkSaveFlashcardsResult:
      type: object
      required: [created, updated, deleted]
      properties:
        created:
          type: array
          items: { $ref: '#/components/schemas/Flashcard' }
        updated:
          type: array
          items: { $ref: '#/components/schemas/Flashcard' }
        deleted:
          type: array
          items: { type: integer, format: int64 }
    Folder:
      type: object
      required: [id, userId, name, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        studySets:
          type: array
          items: { $ref: '#/components/schemas/StudySet' }
    LearningMode:
      type: string
      enum: [flashcards, learn, test, match]
    LearningProgress:
      type: object
      required: [id, userId, studySetId, mode, createdAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        studySetId: { type: integer, format: int64 }
        mode: { $ref: '#/components/schemas/LearningMode' }
        score: { type: integer }
        total: { type: integer }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

paths:
  /healthz:
    get:
      tags: [health]
      responses:
        '200':
          description: Gateway healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string }
                  status: { type: string }
  /healthz/services:
    get:
      tags: [health]
      responses:
        '200':
          description: Service health

  /v1/auth/register:
    post:
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '409': { description: Email already exists, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/auth/login:
    post:
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Logged in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/auth/me:
    get:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Current session, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
  /v1/auth/logout:
    post:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Logged out }
  /v1/auth/logout-all:
    post:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: All sessions revoked }
  /v1/auth/refresh:
    post:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Refreshed, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { description: Invalid session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/auth/profile:
    get:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    patch:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                image: { type: string }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }

  /v1/study-sets:
    get:
      tags: [study-sets]
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: sort, schema: { type: string, enum: [updated, created, title], default: updated } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paginated study sets, content: { application/json: { schema: { $ref: '#/components/schemas/StudySetListResult' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: [study-sets]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/StudySet' } } } }

  /v1/study-sets/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [study-sets]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Study set detail, content: { application/json: { schema: { $ref: '#/components/schemas/StudySet' } } } }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Not found }
    put:
      tags: [study-sets]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/StudySet' } } } }
    delete:
      tags: [study-sets]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Deleted }

  /v1/study-sets/{studySetId}/flashcards:
    parameters:
      - { in: path, name: studySetId, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [flashcards]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [term, definition]
              properties:
                term: { type: string }
                definition: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Flashcard' } } } }
  /v1/study-sets/{studySetId}/flashcards/bulk:
    parameters:
      - { in: path, name: studySetId, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [flashcards]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkSaveFlashcardsRequest' }
      responses:
        '200': { description: Transactional bulk result, content: { application/json: { schema: { $ref: '#/components/schemas/BulkSaveFlashcardsResult' } } } }
        '403': { description: Forbidden }
        '404': { description: Study set not found }
        '422': { description: Validation error }

  /v1/flashcards/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [flashcards]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                term: { type: string }
                definition: { type: string }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Flashcard' } } } }
    delete:
      tags: [flashcards]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Deleted }
  /v1/flashcards/{id}/star:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [flashcards]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Star toggled, content: { application/json: { schema: { $ref: '#/components/schemas/Flashcard' } } } }

  /v1/folders:
    get:
      tags: [folders]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Folder list, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Folder' } } } } }
    post:
      tags: [folders]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } } }
  /v1/folders/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [folders]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Folder detail, content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } } }
    put:
      tags: [folders]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } } }
    delete:
      tags: [folders]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Deleted }
  /v1/folders/{id}/study-sets:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [folders]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studySetId]
              properties:
                studySetId: { type: integer, format: int64 }
      responses:
        '200': { description: Added }
  /v1/folders/{id}/study-sets/{setId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      - { in: path, name: setId, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [folders]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Removed }

  /v1/learning/progress:
    post:
      tags: [learning]
      description: Draft contract only. Backend implementation is Phase 3 scope.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studySetId, mode, score, total]
              properties:
                studySetId: { type: integer, format: int64 }
                mode: { $ref: '#/components/schemas/LearningMode' }
                score: { type: integer }
                total: { type: integer }
      responses:
        '201': { description: Draft }
  /v1/learning/progress/{studySetId}:
    parameters:
      - { in: path, name: studySetId, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [learning]
      description: Draft contract only. Backend implementation is Phase 3 scope.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Draft progress list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LearningProgress' }
