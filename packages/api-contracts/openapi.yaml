openapi: 3.1.0
info:
  title: HQuizlet Platform API
  version: 1.7.0
  description: |
    HQuizlet Platform API contract. All public application routes are exposed
    through the gateway at localhost:8080.
    Phase 9 adds File Upload: presigned URL upload flow for avatars, flashcard
    images, and study set thumbnails.
servers:
  - url: http://localhost:8080
    description: Local gateway

tags:
  - name: health
  - name: auth
  - name: study-sets
  - name: flashcards
  - name: folders
  - name: progress
  - name: quiz
  - name: live-sessions
  - name: live-join
  - name: live-player
  - name: live-leaderboard
  - name: classes
  - name: class-members
  - name: class-study-sets
  - name: activity
  - name: files

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    ParticipantAuth:
      type: http
      scheme: bearer
      description: 'Opaque participant token issued on join. Use "Authorization: Bearer <participantToken>".'

  schemas:
    Error:
      type: object
      required: [code, message, requestId, details]
      properties:
        code:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "score must be between 0 and total"
        requestId:
          type: string
          example: "20260901143000.000000000"
        details:
          type: object
          additionalProperties: true
          example: {}

    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        image: { type: string }
        role: { type: string }
        createdAt: { type: string, format: date-time }

    AuthResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }

    StudySet:
      type: object
      required: [id, userId, title, description, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        thumbnailUrl: { type: [string, 'null'], description: 'Optional study set thumbnail image URL' }
        flashcards:
          type: array
          items: { $ref: '#/components/schemas/Flashcard' }

    Flashcard:
      type: object
      required: [id, studySetId, term, definition, starred, position, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        studySetId: { type: integer, format: int64 }
        term: { type: string }
        definition: { type: string }
        starred: { type: boolean }
        position: { type: integer }
        imageUrl: { type: [string, 'null'], description: 'Optional flashcard illustration image URL' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FolderSummary:
      type: object
      required: [id, title, description, studySetCount, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, minLength: 1 }
        description: { type: string }
        studySetCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FolderDetail:
      allOf:
        - { $ref: '#/components/schemas/FolderSummary' }
        - type: object
          required: [studySets]
          properties:
            studySets:
              type: array
              items: { $ref: '#/components/schemas/StudySet' }
    CreateFolderRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
    UpdateFolderRequest:
      $ref: '#/components/schemas/CreateFolderRequest'
    AddStudySetToFolderRequest:
      type: object
      additionalProperties: false
      required: [studySetId]
      properties:
        studySetId: { type: integer, format: int64, minimum: 1 }

    StudySetList:
      type: object
      required: [items, total, page, perPage, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StudySet' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 0 }

    QuizGenerateRequest:
      type: object
      required: [mode, seed]
      properties:
        mode: { $ref: '#/components/schemas/LearningMode' }
        seed: { type: integer, format: int64, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100, default: 100 }
        options: { type: object, additionalProperties: true }
    QuizGeneratedItem:
      type: object
      required: [id, flashcardId, kind, position]
      properties:
        id: { type: string }
        flashcardId: { type: integer, format: int64 }
        kind: { type: string, enum: [question, term, definition] }
        text: { type: string }
        term: { type: string }
        definition: { type: string }
        choices: { type: array, items: { type: string } }
        pairId: { type: string }
        starred: { type: boolean }
        position: { type: integer, minimum: 0 }
    QuizAnswer:
      type: object
      required: [flashcardId, attempts]
      properties:
        flashcardId: { type: integer, format: int64 }
        submitted: { type: string }
        selectedIndex: { type: integer, minimum: 0 }
        pairId: { type: string }
        matchedFlashcardId: { type: integer, format: int64 }
        attempts: { type: integer, minimum: 1, maximum: 100 }
        responseTimeMs: { type: integer, minimum: 0 }
    QuizEvaluateRequest:
      type: object
      required: [mode, seed, limit, answers]
      properties:
        mode: { $ref: '#/components/schemas/LearningMode' }
        seed: { type: integer, format: int64, minimum: 0 }
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Must match the limit used for quiz/generate with the same mode and seed.
        answers: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/QuizAnswer' } }

    BulkFlashcardItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        term: { type: string }
        definition: { type: string }
        position: { type: integer }
        delete: { type: boolean }

    BulkSaveFlashcardsRequest:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          items: { $ref: '#/components/schemas/BulkFlashcardItem' }

    BulkSaveResult:
      type: object
      required: [created, updated, deleted]
      properties:
        created: { type: array, items: { $ref: '#/components/schemas/Flashcard' } }
        updated: { type: array, items: { $ref: '#/components/schemas/Flashcard' } }
        deleted: { type: array, items: { type: integer, format: int64 } }

    LearningMode:
      type: string
      enum: [flashcards, learn, test, match]

    CardResult:
      type: object
      required: [flashcardId, correct, attempts]
      properties:
        flashcardId: { type: integer, format: int64 }
        correct: { type: boolean }
        attempts: { type: integer, minimum: 1, maximum: 100 }
        responseTimeMs: { type: integer, minimum: 0 }

    LearningProgressSession:
      type: object
      required: [id, userId, studySetId, mode, score, total, startedAt, createdAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        studySetId: { type: integer, format: int64 }
        mode: { $ref: '#/components/schemas/LearningMode' }
        score: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0, maximum: 100 }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        cardResults: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/CardResult' } }

    SaveProgressRequest:
      type: object
      required: [mode, score, total, startedAt, idempotencyKey]
      properties:
        mode: { $ref: '#/components/schemas/LearningMode' }
        score: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0, maximum: 100 }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        idempotencyKey: { type: string, minLength: 8, maxLength: 128 }
        cardResults:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/CardResult' }

    ProgressSummary:
      type: object
      required: [studySetId, totalSessions, history, page, perPage, totalPages]
      properties:
        studySetId: { type: integer, format: int64 }
        totalSessions: { type: integer, minimum: 0 }
        bestScore: { type: [integer, 'null'], minimum: 0 }
        lastMode:
          oneOf:
            - { $ref: '#/components/schemas/LearningMode' }
            - { type: 'null' }
        history:
          type: array
          items: { $ref: '#/components/schemas/LearningProgressSession' }
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 0 }

    # ---- Phase 6: Live Quiz Schemas ----

    LiveSessionStatus:
      type: string
      enum: [LOBBY, QUESTION_OPEN, QUESTION_CLOSED, LEADERBOARD, ENDED]

    CreateLiveSessionRequest:
      type: object
      additionalProperties: false
      required: [studySetId, questionCount, questionDurationMs]
      properties:
        studySetId:
          type: integer
          format: int64
          minimum: 1
        questionCount:
          type: integer
          minimum: 1
          maximum: 100
        questionDurationMs:
          type: integer
          minimum: 5000
          maximum: 120000
        seed:
          type: integer
          format: int64
          minimum: 0

    LiveSession:
      type: object
      required: [id, code, hostUserId, studySetId, status, questionCount, questionDurationMs, stateVersion, createdAt]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, pattern: '^[A-Z2-9]{6}$' }
        hostUserId: { type: integer, format: int64 }
        studySetId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/LiveSessionStatus' }
        questionCount: { type: integer }
        questionDurationMs: { type: integer }
        currentQuestionIndex: { type: [integer, 'null'] }
        stateVersion: { type: integer, format: int64 }
        startedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    LiveParticipant:
      type: object
      required: [id, displayName, totalScore, correctCount, joinedAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        totalScore: { type: integer }
        correctCount: { type: integer }
        totalResponseTimeMs: { type: integer, format: int64 }
        joinedAt: { type: string, format: date-time }

    JoinLiveSessionRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40

    JoinLiveSessionResponse:
      type: object
      required: [sessionId, participantId, participantToken, status]
      properties:
        sessionId: { type: integer, format: int64 }
        participantId: { type: string, format: uuid }
        participantToken: { type: string }
        status: { $ref: '#/components/schemas/LiveSessionStatus' }

    LivePlayerAnswer:
      type: object
      required: [questionIndex, answer, idempotencyKey]
      properties:
        questionIndex: { type: integer, minimum: 0 }
        answer:
          type: object
          required: [selectedIndex]
          properties:
            selectedIndex: { type: integer, minimum: 0 }
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128

    LiveAnswerAccepted:
      type: object
      required: [accepted, questionIndex, submittedAt]
      properties:
        accepted: { type: boolean }
        questionIndex: { type: integer }
        submittedAt: { type: string, format: date-time }

    LiveQuestion:
      type: object
      required: [index, flashcardId, text, choices, startsAt, closesAt]
      properties:
        index: { type: integer }
        flashcardId: { type: integer, format: int64 }
        text: { type: string }
        choices: { type: array, items: { type: string } }
        startsAt: { type: string, format: date-time }
        closesAt: { type: string, format: date-time }

    LiveLeaderboard:
      type: object
      required: [sessionId, stateVersion, rankings]
      properties:
        sessionId: { type: integer, format: int64 }
        stateVersion: { type: integer, format: int64 }
        rankings:
          type: array
          items:
            type: object
            required: [rank, participantId, displayName, totalScore, correctCount]
            properties:
              rank: { type: integer, minimum: 1 }
              participantId: { type: string, format: uuid }
              displayName: { type: string }
              totalScore: { type: integer }
              correctCount: { type: integer }
              totalResponseTimeMs: { type: integer, format: int64 }

    LiveSSEEvent:
      type: object
      required: [eventId, sessionId, stateVersion, event, data, serverTime]
      properties:
        eventId: { type: string }
        sessionId: { type: integer, format: int64 }
        stateVersion: { type: integer, format: int64 }
        event:
          type: string
          enum:
            - session.snapshot
            - participant.joined
            - session.started
            - question.opened
            - answer.accepted
            - question.closed
            - leaderboard.updated
            - session.ended
            - heartbeat
        data: { type: object, additionalProperties: true }
        serverTime: { type: string, format: date-time }

    # ---- Phase 7: Class Schemas ----

    ClassSummary:
      type: object
      required: [id, name, description, inviteCode, memberCount, studySetCount, myRole, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, minLength: 1 }
        description: { type: string }
        inviteCode: { type: string, pattern: '^[A-Z2-9]{8}$' }
        memberCount: { type: integer, minimum: 0 }
        studySetCount: { type: integer, minimum: 0 }
        myRole: { type: string, enum: [owner, teacher, student] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ClassDetail:
      allOf:
        - { $ref: '#/components/schemas/ClassSummary' }
        - type: object
          required: [maxMembers]
          properties:
            maxMembers: { type: integer, minimum: 1, maximum: 1000 }

    CreateClassRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string }
        maxMembers: { type: integer, minimum: 2, maximum: 1000, default: 100 }

    UpdateClassRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string }

    ClassMember:
      type: object
      required: [id, classId, userId, role, joinedAt]
      properties:
        id: { type: integer, format: int64 }
        classId: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        role: { type: string, enum: [owner, teacher, student] }
        joinedAt: { type: string, format: date-time }

    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [userId, role]
      properties:
        userId: { type: integer, format: int64, minimum: 1 }
        role: { type: string, enum: [teacher, student] }

    UpdateMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { type: string, enum: [teacher, student] }

    ClassStudySetSummary:
      type: object
      required: [classId, studySetId, addedByUserId, addedAt]
      properties:
        classId: { type: integer, format: int64 }
        studySetId: { type: integer, format: int64 }
        title: { type: string }
        flashcardCount: { type: integer, minimum: 0 }
        addedByUserId: { type: integer, format: int64 }
        addedAt: { type: string, format: date-time }

    AddStudySetToClassRequest:
      type: object
      additionalProperties: false
      required: [studySetId]
      properties:
        studySetId: { type: integer, format: int64, minimum: 1 }

    JoinClassResponse:
      type: object
      required: [classId, className, myRole, joinedAt]
      properties:
        classId: { type: integer, format: int64 }
        className: { type: string }
        myRole: { type: string, enum: [student] }
        joinedAt: { type: string, format: date-time }

    ActivityItem:
      type: object
      required: [id, eventType, entityType, occurredAt]
      properties:
        id: { type: integer, format: int64 }
        eventType: { type: string }
        entityType: { type: string }
        entityId: { type: [integer, 'null'], format: int64 }
        classId: { type: [integer, 'null'], format: int64 }
        metadata: { type: object, additionalProperties: true }
        occurredAt: { type: string, format: date-time }

    ActivityFeedResponse:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActivityItem' }
        nextCursor: { type: string, description: 'Opaque base64 cursor for next page' }
        hasMore: { type: boolean }

    # ---- Phase 9: File Upload Schemas ----

    PresignUploadRequest:
      type: object
      required: [upload_type, filename, content_type, file_size]
      properties:
        upload_type:
          type: string
          enum: [avatar, flashcard_image, study_set_thumbnail]
        filename: { type: string, minLength: 1, maxLength: 255 }
        content_type: { type: string }
        file_size: { type: integer, format: int64, minimum: 1 }

    PresignUploadResponse:
      type: object
      required: [file_id, upload_url, upload_method, expires_at, headers_required]
      properties:
        file_id: { type: string, format: uuid }
        upload_url: { type: string, format: uri }
        upload_method: { type: string, const: PUT }
        expires_at: { type: string, format: date-time }
        headers_required:
          type: object
          properties:
            Content-Type: { type: string }

    ConfirmUploadResponse:
      type: object
      required: [file_id, url, upload_type, size_bytes, confirmed_at]
      properties:
        file_id: { type: string, format: uuid }
        url: { type: string, format: uri }
        upload_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        confirmed_at: { type: string, format: date-time }

    FileMetadata:
      type: object
      required: [file_id, upload_type, filename, content_type, size_bytes, url, status, created_at]
      properties:
        file_id: { type: string, format: uuid }
        upload_type: { type: string }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        url: { type: string, format: uri }
        status: { type: string, enum: [pending, active, deleted] }
        created_at: { type: string, format: date-time }
        confirmed_at: { type: [string, 'null'], format: date-time }

    QuotaInfo:
      type: object
      required: [active_files, max_files, used_bytes, max_bytes]
      properties:
        active_files: { type: integer, minimum: 0 }
        max_files: { type: integer, const: 100 }
        used_bytes: { type: integer, format: int64, minimum: 0 }
        max_bytes: { type: integer, format: int64, const: 524288000 }

    FileListResponse:
      type: object
      required: [items, total, quota]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FileMetadata' }
        total: { type: integer, minimum: 0 }
        quota: { $ref: '#/components/schemas/QuotaInfo' }

    # ---- End Phase 9 Schemas ----

    # ---- End Phase 7 Schemas ----

    # ---- End Phase 6 Schemas ----

paths:
  /v1/study-sets/{studySetId}/quiz/generate:
    parameters:
      - { in: path, name: studySetId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      tags: [quiz]
      summary: Generate a deterministic learning session
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuizGenerateRequest' } } }
      responses:
        '200':
          description: Generated session
          content:
            application/json:
              schema:
                type: object
                required: [mode, seed, items, contractVersion]
                properties:
                  mode: { $ref: '#/components/schemas/LearningMode' }
                  seed: { type: integer, format: int64 }
                  items: { type: array, items: { $ref: '#/components/schemas/QuizGeneratedItem' } }
                  contractVersion: { type: string, const: 1.5.0 }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Study set not owned by caller, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Invalid quiz options, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/study-sets/{studySetId}/quiz/evaluate:
    parameters:
      - { in: path, name: studySetId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      tags: [quiz]
      summary: Evaluate answers using server-owned card data
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuizEvaluateRequest' } } }
      responses:
        '200':
          description: Server-scored result
          content:
            application/json:
              schema:
                type: object
                required: [mode, seed, score, total, cardResults, contractVersion]
                properties:
                  mode: { $ref: '#/components/schemas/LearningMode' }
                  seed: { type: integer, format: int64 }
                  score: { type: integer, minimum: 0 }
                  total: { type: integer, minimum: 0, maximum: 100 }
                  cardResults: { type: array, items: { $ref: '#/components/schemas/CardResult' } }
                  contractVersion: { type: string, const: 1.5.0 }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Study set not owned by caller, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Invalid or foreign answers, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---- Phase 6: Live Quiz Endpoints ----

  /v1/live-sessions:
    post:
      tags: [live-sessions]
      summary: Create a live quiz session (host only)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateLiveSessionRequest' } } }
      responses:
        '201':
          description: Session created
          content: { application/json: { schema: { $ref: '#/components/schemas/LiveSession' } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Study set not owned by caller, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Live session conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/live-sessions/{sessionId}:
    parameters:
      - { in: path, name: sessionId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      tags: [live-sessions]
      summary: Get host state/detail for a live session
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Session detail with participants
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/LiveSession' }
                  - type: object
                    properties:
                      participants:
                        type: array
                        items: { $ref: '#/components/schemas/LiveParticipant' }
                      currentQuestion: { $ref: '#/components/schemas/LiveQuestion' }
                      answerCount: { type: integer }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not the host, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: Session ended, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/live-sessions/{code}/join:
    parameters:
      - { in: path, name: code, required: true, schema: { type: string, pattern: '^[A-Z2-9]{6}$' } }
    post:
      tags: [live-join]
      summary: Join a live session by code (public, rate-limited)
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/JoinLiveSessionRequest' } } }
      responses:
        '200':
          description: Joined successfully, participant token returned
          content: { application/json: { schema: { $ref: '#/components/schemas/JoinLiveSessionResponse' } } }
        '404': { description: Invalid or expired join code, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Display name taken, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: Session ended, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Live state unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/live-sessions/{sessionId}/player-state:
    parameters:
      - { in: path, name: sessionId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      tags: [live-player]
      summary: Player polling fallback for current state
      security: [{ ParticipantAuth: [] }]
      responses:
        '200':
          description: Current player view state
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { $ref: '#/components/schemas/LiveSessionStatus' }
                  currentQuestion: { $ref: '#/components/schemas/LiveQuestion' }
                  hasSubmitted: { type: boolean }
                  leaderboard: { $ref: '#/components/schemas/LiveLeaderboard' }
        '401': { description: Invalid participant token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Live state unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/live-sessions/{sessionId}/events:
    parameters:
      - { in: path, name: sessionId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      tags: [live-sessions]
      summary: SSE event stream (host or player scope)
      security: [{ BearerAuth: [] }, { ParticipantAuth: [] }]
      parameters:
        - { in: header, name: Last-Event-ID, schema: { type: string }, description: Reconnect with last received event ID }
      responses:
        '200':
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/live-sessions/{sessionId}/start:
    parameters:
      - { in: path, name: sessionId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      tags: [live-sessions]
      summary: Start session and open first question (host only)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Session started, first question opened
          content: { application/json: { schema: { $ref: '#/components/schemas/LiveSession' } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not the host, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Invalid state transition, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/live-sessions/{sessionId}/questions/current/close:
    parameters:
      - { in: path, name: sessionId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      tags: [live-sessions]
      summary: Close current question (host only, idempotent)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Question closed
          content: { application/json: { schema: { $ref: '#/components/schemas/LiveSession' } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not the host, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Invalid state, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/live-sessions/{sessionId}/questions/next:
    parameters:
      - { in: path, name: sessionId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      tags: [live-sessions]
      summary: Open next question (host only)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Next question opened
          content: { application/json: { schema: { $ref: '#/components/schemas/LiveSession' } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not the host, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: No more questions or invalid state, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/live-sessions/{sessionId}/answers:
    parameters:
      - { in: path, name: sessionId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      tags: [live-player]
      summary: Submit answer for current question (player only, one per question)
      security: [{ ParticipantAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LivePlayerAnswer' } } }
      responses:
        '200':
          description: Answer accepted
          content: { application/json: { schema: { $ref: '#/components/schemas/LiveAnswerAccepted' } } }
        '401': { description: Invalid participant token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Answer already submitted or invalid state, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '410': { description: Question closed or session ended, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/live-sessions/{sessionId}/leaderboard:
    parameters:
      - { in: path, name: sessionId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      tags: [live-leaderboard]
      summary: Current leaderboard (host or player)
      security: [{ BearerAuth: [] }, { ParticipantAuth: [] }]
      responses:
        '200':
          description: Leaderboard rankings
          content: { application/json: { schema: { $ref: '#/components/schemas/LiveLeaderboard' } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/live-sessions/{sessionId}/end:
    parameters:
      - { in: path, name: sessionId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      tags: [live-sessions]
      summary: End session (host only)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Session ended
          content: { application/json: { schema: { $ref: '#/components/schemas/LiveSession' } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not the host, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Invalid state, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---- End Phase 6 Endpoints ----

  # ---- Phase 7: Class & Activity Endpoints ----

  /v1/classes:
    get:
      tags: [classes]
      summary: List classes the current user is a member of
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Class list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClassSummary' }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: [classes]
      summary: Create a new class
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateClassRequest' } } }
      responses:
        '201':
          description: Class created
          content: { application/json: { schema: { $ref: '#/components/schemas/ClassDetail' } } }
        '400': { description: Bad request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/classes/{classId}:
    parameters:
      - { in: path, name: classId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      tags: [classes]
      summary: Get class detail (member only)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Class detail
          content: { application/json: { schema: { $ref: '#/components/schemas/ClassDetail' } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not a member, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    put:
      tags: [classes]
      summary: Update class (owner only)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateClassRequest' } } }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/ClassDetail' } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not owner, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [classes]
      summary: Delete class (owner only)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Deleted }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not owner, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/classes/{code}/join:
    parameters:
      - { in: path, name: code, required: true, schema: { type: string, pattern: '^[A-Z2-9]{8}$' } }
    post:
      tags: [classes]
      summary: Join class by invite code
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Joined
          content: { application/json: { schema: { $ref: '#/components/schemas/JoinClassResponse' } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Invalid invite code, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Already a member, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/classes/{classId}/invite-code/reset:
    parameters:
      - { in: path, name: classId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      tags: [classes]
      summary: Reset invite code (owner only)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: New invite code
          content:
            application/json:
              schema:
                type: object
                properties:
                  inviteCode: { type: string }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not owner, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/classes/{classId}/members:
    parameters:
      - { in: path, name: classId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      tags: [class-members]
      summary: List class members (member only)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClassMember' }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not a member, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: [class-members]
      summary: Add member manually (owner/teacher only)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddMemberRequest' } } }
      responses:
        '201':
          description: Member added
          content: { application/json: { schema: { $ref: '#/components/schemas/ClassMember' } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not owner/teacher, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Already a member, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/classes/{classId}/members/me:
    parameters:
      - { in: path, name: classId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    delete:
      tags: [class-members]
      summary: Leave class (non-owner only)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Left class }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Owner cannot leave, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/classes/{classId}/members/{userId}:
    parameters:
      - { in: path, name: classId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - { in: path, name: userId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    put:
      tags: [class-members]
      summary: Update member role (owner only)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMemberRoleRequest' } } }
      responses:
        '200': { description: Role updated }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not owner, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [class-members]
      summary: Remove member (owner only)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Member removed }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not owner, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/classes/{classId}/study-sets:
    parameters:
      - { in: path, name: classId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      tags: [class-study-sets]
      summary: List class study sets (member only)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Study set list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClassStudySetSummary' }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not a member, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: [class-study-sets]
      summary: Add study set to class (owner/teacher only)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddStudySetToClassRequest' } } }
      responses:
        '200': { description: Study set added }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not owner/teacher, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Study set not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Already added, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/classes/{classId}/study-sets/{studySetId}:
    parameters:
      - { in: path, name: classId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - { in: path, name: studySetId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    delete:
      tags: [class-study-sets]
      summary: Remove study set from class (owner/teacher only)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Study set removed }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not owner/teacher, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/activity:
    get:
      tags: [activity]
      summary: Get activity feed for current user
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: cursor, schema: { type: string }, description: 'Opaque cursor from previous response' }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Activity feed
          content: { application/json: { schema: { $ref: '#/components/schemas/ActivityFeedResponse' } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---- Phase 9: File Upload Endpoints ----

  /v1/files/presign:
    post:
      tags: [files]
      summary: Request a presigned URL for file upload
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignUploadRequest' }
      responses:
        '201':
          description: Presigned URL created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresignUploadResponse' }
        '400':
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' } 
        '401': { description: Authentication required }
        '429':
          description: Quota exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/files/{fileId}:
    parameters:
      - { in: path, name: fileId, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [files]
      summary: Get file metadata (owner only)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileMetadata' }
        '401': { description: Authentication required }
        '403': { description: Not owner }
        '404': { description: File not found }
    delete:
      tags: [files]
      summary: Soft delete a file (owner only)
      security: [{ BearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { description: Authentication required }
        '403': { description: Not owner }
        '404': { description: File not found }

  /v1/files/{fileId}/confirm:
    parameters:
      - { in: path, name: fileId, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [files]
      summary: Confirm upload and activate file metadata
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: File confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmUploadResponse' }
        '401': { description: Authentication required }
        '403': { description: Not owner }
        '404': { description: File not found }
        '409':
          description: Already confirmed or not yet uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/files:
    get:
      tags: [files]
      summary: List user files with quota info
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: File list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileListResponse' }
        '401': { description: Authentication required }

  # ---- End Phase 9 Endpoints ----

  # ---- End Phase 7 Endpoints ----

  /healthz:
    get:
      security: []
      tags: [health]
      responses:
        '200':
          description: Gateway healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string }
                  status: { type: string }

  /healthz/services:
    get:
      security: []
      tags: [health]
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        url: { type: string }
                        status: { type: string, enum: [ok, offline, degraded] }

  /v1/auth/register:
    post:
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
                name: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { description: Invalid JSON, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Email already registered, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/auth/login:
    post:
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/auth/me:
    get:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Current auth state, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }

  /v1/auth/logout:
    post:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Logged out }

  /v1/auth/logout-all:
    post:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: All sessions revoked }

  /v1/auth/refresh:
    post:
      tags: [auth]
