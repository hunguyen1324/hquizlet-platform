openapi: 3.1.0
info:
  title: HQuizlet Platform API
  version: 2.0.0
  description: |
    HQuizlet Platform – Phase 2 OpenAPI Contract.
    Tất cả route đi qua gateway tại localhost:8080.
    Frontend và backend đều dùng file này làm nguồn sự thật.

    CHANGELOG v2.0.0 (feature/phase2-integration [Dev5]):
    - P2-INT-01: Thêm /v1/auth/refresh endpoint
    - P2-INT-01: Thêm /v1/auth/profile (update user name/image)
    - P2-INT-01: Thêm /v1/folders CRUD (P2-STUDY-04)
    - P2-INT-01: Thêm /v1/study-sets GET search/filter params (P2-STUDY-03)
    - P2-INT-01: Thêm /v1/study-sets/{id}/flashcards bulk save (P2-STUDY-02)
    - P2-INT-01: Thêm /v1/learning/progress draft contract (P2-LEARN-05)
    - Error schema thống nhất 401/403/404/409/422

    CHANGELOG v1.2.0 (feature/integration-contracts [Dev5]):
    - StudySet/Flashcard: snake_case → camelCase
    - version bump 1.1.0 → 1.2.0

servers:
  - url: http://localhost:8080
    description: Local dev (qua gateway)

tags:
  - name: health
    description: Health check
  - name: auth
    description: Xác thực người dùng
  - name: study-sets
    description: Quản lý học phần
  - name: flashcards
    description: Quản lý thẻ từ vựng
  - name: folders
    description: Quản lý thư mục học phần
  - name: learning
    description: Tiến độ học tập (Phase 2 draft)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    # ── Errors ────────────────────────────────────────────────────────────────
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "invalid credentials"
        details:
          type: string
          example: "password too short"

    # ── Auth ──────────────────────────────────────────────────────────────────
    # Khớp services/auth/internal/model/model.go User struct
    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: "user@example.com"
        name:
          type: string
          example: "Nguyen Van A"
        image:
          type: string
          example: ""
        role:
          type: string
          example: "user"
        createdAt:
          type: string
          format: date-time

    # Khớp services/auth/internal/model/model.go SessionResponse struct
    AuthResponse:
      type: object
      required: [authenticated, token, expiresAt, user]
      properties:
        authenticated:
          type: boolean
          example: true
        token:
          type: string
          description: Bearer token để gửi trong Authorization header
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    # ── Study Sets ────────────────────────────────────────────────────────────
    # Khớp services/study/internal/model (study_sets table)
    StudySet:
      type: object
      required: [id, userId, title, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        userId:
          type: integer
          format: int64
          example: 42
        title:
          type: string
          example: "Từ vựng IELTS Band 7"
        description:
          type: string
          example: ""
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StudySetDetail:
      allOf:
        - $ref: '#/components/schemas/StudySet'
        - type: object
          properties:
            flashcards:
              type: array
              items:
                $ref: '#/components/schemas/Flashcard'

    # ── Flashcards ────────────────────────────────────────────────────────────
    # Khớp services/study/internal/model (flashcards table)
    Flashcard:
      type: object
      required: [id, studySetId, term, definition, starred, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        studySetId:
          type: integer
          format: int64
          example: 1
        term:
          type: string
          example: "Ephemeral"
        definition:
          type: string
          example: "Lasting for a very short time"
        starred:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Folders ───────────────────────────────────────────────────────────────
    # P2-STUDY-04 — schema cho folder core
    Folder:
      type: object
      required: [id, userId, title, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        userId:
          type: integer
          format: int64
          example: 42
        title:
          type: string
          example: "IELTS Preparation"
        description:
          type: string
          example: ""
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FolderDetail:
      allOf:
        - $ref: '#/components/schemas/Folder'
        - type: object
          properties:
            studySets:
              type: array
              items:
                $ref: '#/components/schemas/StudySet'

    # ── Learning Progress ─────────────────────────────────────────────────────
    # P2-LEARN-05 — draft contract, chưa implement backend, chỉ dùng để frontend
    # biết shape khi Phase 3 build. Backend sẽ implement trong Phase 3.
    LearningMode:
      type: string
      enum: [flashcards, learn, test, match]

    LearningProgress:
      type: object
      required: [id, userId, studySetId, mode, createdAt]
      description: |
        DRAFT – Phase 3 sẽ implement endpoint. Hiện Phase 2 chỉ lưu local.
        Dev 4 dùng type này để thiết kế local state, không gọi API thật.
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        studySetId:
          type: integer
          format: int64
        mode:
          $ref: '#/components/schemas/LearningMode'
        score:
          type: integer
          description: "Số câu đúng"
          example: 8
        total:
          type: integer
          description: "Tổng số câu"
          example: 10
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ── Bulk Flashcard Save ───────────────────────────────────────────────────
    # P2-STUDY-02 — bulk save để editor gọi 1 lần thay vì N lần
    BulkFlashcardItem:
      type: object
      required: [term, definition]
      properties:
        id:
          type: integer
          format: int64
          description: "Nếu có id → update; không có → create"
          nullable: true
        term:
          type: string
          example: "Ephemeral"
        definition:
          type: string
          example: "Short-lived"

    BulkFlashcardRequest:
      type: object
      required: [flashcards]
      properties:
        flashcards:
          type: array
          items:
            $ref: '#/components/schemas/BulkFlashcardItem'
          description: "Danh sách cards. Card có id → update/delete, không có id → create. Cards cũ không trong list → delete."

    BulkFlashcardResponse:
      type: object
      required: [flashcards]
      properties:
        flashcards:
          type: array
          items:
            $ref: '#/components/schemas/Flashcard'

paths:

  # ── Health ──────────────────────────────────────────────────────────────────
  /healthz:
    get:
      tags: [health]
      summary: Gateway health check
      responses:
        "200":
          description: Gateway OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string, example: "gateway" }
                  status:  { type: string, example: "ok" }

  /healthz/services:
    get:
      tags: [health]
      summary: Trạng thái tất cả service
      responses:
        "200":
          description: Danh sách trạng thái service
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        name:   { type: string }
                        url:    { type: string }
                        status: { type: string, enum: [ok, offline] }

  # ── Auth ────────────────────────────────────────────────────────────────────
  /v1/auth/register:
    post:
      tags: [auth]
      summary: Đăng ký tài khoản mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  example: "Nguyen Van A"
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  minLength: 8
                  example: "StrongPass1!"
      responses:
        "201":
          description: Đăng ký thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        "409":
          description: Email đã tồn tại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "422":
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                password:
                  type: string
                  example: "StrongPass1!"
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        "401":
          description: Sai email hoặc mật khẩu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Đăng xuất – thu hồi session
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Đăng xuất thành công
        "401":
          description: Chưa xác thực
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/auth/me:
    get:
      tags: [auth]
      summary: Lấy thông tin người dùng hiện tại
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Trả AuthResponse (authenticated=true + user)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        "401":
          description: Chưa xác thực
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Làm mới session token (P2-AUTH-01)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Token mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        "401":
          description: Session hết hạn hoặc không hợp lệ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/auth/profile:
    put:
      tags: [auth]
      summary: Cập nhật thông tin cơ bản (P2-AUTH-03)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Nguyen Van B"
                image:
                  type: string
                  example: "https://example.com/avatar.jpg"
      responses:
        "200":
          description: User sau khi cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        "401":
          description: Chưa xác thực
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "422":
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Study Sets ───────────────────────────────────────────────────────────────
  /v1/study-sets:
    get:
      tags: [study-sets]
      summary: Danh sách học phần của user hiện tại (P2-STUDY-03)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: "Tìm kiếm theo title"
        - in: query
          name: sort
          schema:
            type: string
            enum: [updatedAt, createdAt, title]
            default: updatedAt
          description: "Sắp xếp theo trường"
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: "Hướng sắp xếp"
      responses:
        "200":
          description: Array học phần
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudySet'
        "401":
          description: Chưa xác thực
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    post:
      tags: [study-sets]
      summary: Tạo học phần mới
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  example: "Từ vựng IELTS Band 7"
                description:
                  type: string
                  example: ""
      responses:
        "201":
          description: Học phần vừa tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudySet' }
        "401":
          description: Chưa xác thực
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "422":
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/study-sets/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }

    get:
      tags: [study-sets]
      summary: Chi tiết học phần (kèm flashcard)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Chi tiết học phần
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudySetDetail' }
        "401":
          description: Chưa xác thực
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: Không có quyền truy cập
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Không tìm thấy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    put:
      tags: [study-sets]
      summary: Cập nhật thông tin học phần
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:       { type: string }
                description: { type: string }
      responses:
        "200":
          description: Học phần sau khi cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudySet' }
        "403":
          description: Không phải chủ sở hữu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Không tìm thấy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    delete:
      tags: [study-sets]
      summary: Xóa học phần
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Đã xóa thành công
        "403":
          description: Không phải chủ sở hữu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Không tìm thấy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Flashcards ───────────────────────────────────────────────────────────────
  /v1/study-sets/{studySetId}/flashcards:
    parameters:
      - in: path
        name: studySetId
        required: true
        schema: { type: integer, format: int64 }

    post:
      tags: [flashcards]
      summary: Thêm một flashcard vào học phần
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [term, definition]
              properties:
                term:
                  type: string
                  example: "Ephemeral"
                definition:
                  type: string
                  example: "Lasting for a very short time"
      responses:
        "201":
          description: Flashcard vừa tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Flashcard' }
        "403":
          description: Không phải chủ sở hữu học phần
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Học phần không tồn tại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/study-sets/{studySetId}/flashcards/bulk:
    parameters:
      - in: path
        name: studySetId
        required: true
        schema: { type: integer, format: int64 }

    put:
      tags: [flashcards]
      summary: Bulk save flashcards (P2-STUDY-02)
      description: |
        Đồng bộ toàn bộ danh sách flashcard cho 1 study set trong 1 request.
        - Item có id → UPDATE nếu term/definition thay đổi.
        - Item không có id → CREATE mới.
        - Flashcard cũ không có trong danh sách → DELETE.
        Trả về danh sách flashcard cuối cùng sau khi sync.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkFlashcardRequest' }
      responses:
        "200":
          description: Danh sách flashcard sau khi sync
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkFlashcardResponse' }
        "403":
          description: Không phải chủ sở hữu học phần
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Học phần không tồn tại
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "422":
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/flashcards/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }

    put:
      tags: [flashcards]
      summary: Cập nhật flashcard
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                term:       { type: string }
                definition: { type: string }
      responses:
        "200":
          description: Flashcard sau khi cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Flashcard' }
        "403":
          description: Không phải chủ sở hữu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Không tìm thấy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    delete:
      tags: [flashcards]
      summary: Xóa flashcard
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Đã xóa thành công
        "403":
          description: Không phải chủ sở hữu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Không tìm thấy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/flashcards/{id}/star:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }

    post:
      tags: [flashcards]
      summary: Toggle starred cho flashcard
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Trạng thái starred sau khi toggle
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:      { type: integer, format: int64 }
                  starred: { type: boolean }
        "403":
          description: Không có quyền
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Không tìm thấy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Folders ──────────────────────────────────────────────────────────────────
  # P2-STUDY-04 — Folder core (Dev 2 implement backend, Dev 5 định nghĩa contract)
  /v1/folders:
    get:
      tags: [folders]
      summary: Danh sách thư mục của user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Array thư mục
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Folder'
        "401":
          description: Chưa xác thực
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    post:
      tags: [folders]
      summary: Tạo thư mục mới
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  example: "IELTS Preparation"
                description:
                  type: string
                  example: ""
      responses:
        "201":
          description: Thư mục vừa tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
        "401":
          description: Chưa xác thực
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/folders/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }

    get:
      tags: [folders]
      summary: Chi tiết thư mục (kèm study sets)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Chi tiết thư mục
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderDetail' }
        "403":
          description: Không có quyền truy cập
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Không tìm thấy
          content:
            application/json:
