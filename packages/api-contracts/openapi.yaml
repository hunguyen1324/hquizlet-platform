openapi: 3.1.0
info:
  title: HQuizlet Platform API
  version: 1.3.0
  description: |
    HQuizlet Platform API contract. All public application routes are exposed
    through the gateway at localhost:8080.
    Phase 3 freezes Learning Progress, ownership, request-id and error contracts.
servers:
  - url: http://localhost:8080
    description: Local gateway

tags:
  - name: health
  - name: auth
  - name: study-sets
  - name: flashcards
  - name: folders
  - name: progress

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    Error:
      type: object
      required: [code, message, requestId, details]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string, example: score must be between 0 and total }
        requestId: { type: string, example: req-01HXYZ }
        details:
          type: object
          additionalProperties: true

    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        image: { type: string }
        role: { type: string }
        createdAt: { type: string, format: date-time }

    AuthResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }

    StudySet:
      type: object
      required: [id, userId, title, description, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        flashcards:
          type: array
          items: { $ref: '#/components/schemas/Flashcard' }

    Flashcard:
      type: object
      required: [id, studySetId, term, definition, starred, position, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        studySetId: { type: integer, format: int64 }
        term: { type: string }
        definition: { type: string }
        starred: { type: boolean }
        position: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Folder:
      type: object
      required: [id, userId, name, description, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        studySets:
          type: array
          items: { $ref: '#/components/schemas/StudySet' }

    StudySetList:
      type: object
      required: [items, total, page, perPage, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StudySet' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 0 }

    BulkFlashcardItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        term: { type: string }
        definition: { type: string }
        position: { type: integer }
        delete: { type: boolean }

    BulkSaveFlashcardsRequest:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          items: { $ref: '#/components/schemas/BulkFlashcardItem' }

    BulkSaveResult:
      type: object
      required: [created, updated, deleted]
      properties:
        created: { type: array, items: { $ref: '#/components/schemas/Flashcard' } }
        updated: { type: array, items: { $ref: '#/components/schemas/Flashcard' } }
        deleted: { type: array, items: { type: integer, format: int64 } }

    LearningMode:
      type: string
      enum: [flashcards, learn, test, match]

    CardResult:
      type: object
      required: [flashcardId, correct, attempts]
      properties:
        flashcardId: { type: integer, format: int64 }
        correct: { type: boolean }
        attempts: { type: integer, minimum: 1, maximum: 100 }
        responseTimeMs: { type: integer, minimum: 0 }

    LearningProgressSession:
      type: object
      required: [id, userId, studySetId, mode, score, total, startedAt, createdAt]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        studySetId: { type: integer, format: int64 }
        mode: { $ref: '#/components/schemas/LearningMode' }
        score: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0, maximum: 100 }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        cardResults: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/CardResult' } }

    SaveProgressRequest:
      type: object
      required: [mode, score, total, startedAt, idempotencyKey]
      properties:
        mode: { $ref: '#/components/schemas/LearningMode' }
        score: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0, maximum: 100 }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        idempotencyKey: { type: string, minLength: 8, maxLength: 128 }
        cardResults:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/CardResult' }

    ProgressSummary:
      type: object
      required: [studySetId, totalSessions, latest]
      properties:
        studySetId: { type: integer, format: int64 }
        totalSessions: { type: integer, minimum: 0 }
        latest:
          type: object
          nullable: true
          additionalProperties: true
        history:
          type: array
          items: { $ref: '#/components/schemas/LearningProgressSession' }
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1, maximum: 100 }
        totalPages: { type: integer, minimum: 0 }

paths:
  /healthz:
    get:
      tags: [health]
      responses:
        '200':
          description: Gateway healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string }
                  status: { type: string }

  /healthz/services:
    get:
      tags: [health]
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        url: { type: string }
                        status: { type: string, enum: [ok, offline] }

  /v1/auth/register:
    post:
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
                name: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { description: Invalid JSON, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Email already registered, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/auth/login:
    post:
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/auth/me:
    get:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Current auth state, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }

  /v1/auth/logout:
    post:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Logged out }

  /v1/auth/logout-all:
    post:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: All sessions revoked }

  /v1/auth/refresh:
    post:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Refreshed session, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { description: Invalid session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/auth/profile:
    get:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    patch:
      tags: [auth]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                image: { type: string }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }

  /v1/study-sets:
    get:
      tags: [study-sets]
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: sort, schema: { type: string, enum: [updated, created, title] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paginated study sets, content: { application/json: { schema: { $ref: '#/components/schemas/StudySetList' } } } }
    post:
      tags: [study-sets]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/StudySet' } } } }

  /v1/study-sets/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [study-sets]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Study set, content: { application/json: { schema: { $ref: '#/components/schemas/StudySet' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    put:
      tags: [study-sets]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/StudySet' } } } }
    delete:
      tags: [study-sets]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Deleted }

  /v1/study-sets/{studySetId}/flashcards:
    parameters:
      - { in: path, name: studySetId, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [flashcards]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [term, definition]
              properties:
                term: { type: string }
                definition: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Flashcard' } } } }

  /v1/study-sets/{studySetId}/flashcards/bulk:
    parameters:
      - { in: path, name: studySetId, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [flashcards]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkSaveFlashcardsRequest' }
      responses:
        '200': { description: Bulk result, content: { application/json: { schema: { $ref: '#/components/schemas/BulkSaveResult' } } } }

  /v1/flashcards/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [flashcards]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                term: { type: string }
                definition: { type: string }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Flashcard' } } } }
    delete:
      tags: [flashcards]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Deleted }

  /v1/flashcards/{id}/star:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [flashcards]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Starred card, content: { application/json: { schema: { $ref: '#/components/schemas/Flashcard' } } } }

  /v1/folders:
    get:
      tags: [folders]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Folders, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Folder' } } } } }
    post:
      tags: [folders]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } } }

  /v1/folders/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [folders]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Folder detail, content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } } }
    put:
      tags: [folders]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } } }
    delete:
      tags: [folders]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Deleted }

  /v1/folders/{id}/study-sets:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [folders]
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studySetId]
              properties:
                studySetId: { type: integer, format: int64 }
      responses:
        '200': { description: Added }

  /v1/folders/{id}/study-sets/{studySetId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      - { in: path, name: studySetId, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [folders]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Removed }

  /v1/study-sets/{studySetId}/progress:
    parameters:
      - { in: path, name: studySetId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      tags: [progress]
      summary: Save one completed learning session
      security: [{ BearerAuth: [] }]
      parameters:
        - in: header
          name: X-Request-ID
          required: false
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveProgressRequest' }
      responses:
        '201': { description: Progress saved, content: { application/json: { schema: { $ref: '#/components/schemas/LearningProgressSession' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Study set not owned by caller, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Study set or flashcard not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Idempotency conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [progress]
      summary: Progress summary and paginated history
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: header, name: X-Request-ID, schema: { type: string, maxLength: 128 } }
      responses:
        '200': { description: Progress summary, content: { application/json: { schema: { $ref: '#/components/schemas/ProgressSummary' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Study set not owned by caller, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /v1/study-sets/{studySetId}/progress/latest:
    parameters:
      - { in: path, name: studySetId, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    get:
      tags: [progress]
      summary: Latest progress per learning mode
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: header, name: X-Request-ID, schema: { type: string, maxLength: 128 } }
      responses:
        '200': { description: Latest progress, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LearningProgressSession' } } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Study set not owned by caller, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
