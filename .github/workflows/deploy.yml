name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_data:
        description: "Deploy luôn cả data layer (Postgres/Redis/NATS/MinIO)?"
        type: boolean
        default: false

# Chạy trên self-hosted runner cài ở máy dev (Windows). Cần cài sẵn:
#   - Docker Desktop (để build & login GHCR)
#   - OpenSSH Client (ssh, đã có sẵn trên Windows 10/11)
#   - Go, Node/pnpm, Rust (để chạy bước test — hoặc bỏ qua nếu chỉ muốn build/deploy)
permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:

  # ── 1. Test / lint (dùng lại target có sẵn trong Makefile) ────────────────
  test:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend dependencies
        run: |
          npm ci --prefix apps/web
          if ($LASTEXITCODE -ne 0) { throw "Frontend dependency installation failed" }
      - name: Run CI gate
        run: |
          make ci-gate
          if ($LASTEXITCODE -ne 0) { throw "CI gate failed" }

  # ── 2. Build & push image cho từng service Go + web lên GHCR ─────────────
  build-and-push:
    needs: test
    runs-on: [self-hosted]
    strategy:
      matrix:
        service: [gateway, auth, study, quiz, class, payment, file]
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          if ($LASTEXITCODE -ne 0) { throw "GHCR login failed" }

      - name: Build & push ${{ matrix.service }}
        run: |
          docker build -f infra/docker/go-service.Dockerfile --build-arg SERVICE=${{ matrix.service }} `
            -t ghcr.io/${{ github.repository_owner }}/hquizlet-platform-${{ matrix.service }}:${{ github.sha }} `
            -t ghcr.io/${{ github.repository_owner }}/hquizlet-platform-${{ matrix.service }}:latest .
          if ($LASTEXITCODE -ne 0) { throw "Image build failed" }
          docker push ghcr.io/${{ github.repository_owner }}/hquizlet-platform-${{ matrix.service }}:${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw "Deployment command failed" }
          docker push ghcr.io/${{ github.repository_owner }}/hquizlet-platform-${{ matrix.service }}:latest
          if ($LASTEXITCODE -ne 0) { throw "Deployment command failed" }

  build-and-push-web:
    needs: test
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          if ($LASTEXITCODE -ne 0) { throw "GHCR login failed" }
      - name: Build & push web
        run: |
          docker build -f infra/docker/web-prod.Dockerfile --build-arg VITE_GATEWAY_URL=/api `
            -t ghcr.io/${{ github.repository_owner }}/hquizlet-platform-web:${{ github.sha }} `
            -t ghcr.io/${{ github.repository_owner }}/hquizlet-platform-web:latest .
          if ($LASTEXITCODE -ne 0) { throw "Image build failed" }
          docker push ghcr.io/${{ github.repository_owner }}/hquizlet-platform-web:${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw "Deployment command failed" }
          docker push ghcr.io/${{ github.repository_owner }}/hquizlet-platform-web:latest
          if ($LASTEXITCODE -ne 0) { throw "Deployment command failed" }

  # ── 3. Deploy DATA layer (chỉ chạy khi bấm workflow_dispatch + tick chọn) ─
  deploy-data:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_data == true }}
    needs: test
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy data layer
        shell: pwsh
        env:
          SSH_KEY: ${{ secrets.DATA_SERVER_SSH_KEY }}
        run: |
          $keyPath = "$env:RUNNER_TEMP\data_deploy_key"
          Set-Content -Path $keyPath -Value $env:SSH_KEY -NoNewline
          icacls $keyPath /inheritance:r /grant:r "${env:USERNAME}:(R)"
          if ($LASTEXITCODE -ne 0) { throw "Deployment command failed" }
          $target = "${{ secrets.DATA_SERVER_USER }}@${{ secrets.DATA_SERVER_HOST }}"
          $port   = "${{ secrets.DATA_SERVER_PORT }}"
          scp -i $keyPath -P $port -o StrictHostKeyChecking=accept-new setup-nat-go.sh "${target}:/opt/hquizlet/setup-nat-go.sh"
          if ($LASTEXITCODE -ne 0) { throw "Deployment command failed" }
          scp -i $keyPath -P $port -o StrictHostKeyChecking=accept-new infra/docker/docker-compose.data.yml "${target}:/opt/hquizlet/infra/docker/docker-compose.data.yml"
          if ($LASTEXITCODE -ne 0) { throw "Deployment command failed" }
          ssh -i $keyPath -p $port -o StrictHostKeyChecking=accept-new $target "cd /opt/hquizlet && bash setup-nat-go.sh"
          if ($LASTEXITCODE -ne 0) { throw "Deployment command failed" }
          Remove-Item $keyPath -Force

  # ── 4. Deploy APP layer (chạy mỗi lần push lên main, sau khi build xong) ─
  deploy-app:
    needs: [build-and-push, build-and-push-web]
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy app layer
        shell: pwsh
        env:
          SSH_KEY: ${{ secrets.APP_SERVER_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $keyPath = "$env:RUNNER_TEMP\app_deploy_key"
          Set-Content -Path $keyPath -Value $env:SSH_KEY -NoNewline
          icacls $keyPath /inheritance:r /grant:r "${env:USERNAME}:(R)"
          if ($LASTEXITCODE -ne 0) { throw "Deployment command failed" }
          $target = "${{ secrets.APP_SERVER_USER }}@${{ secrets.APP_SERVER_HOST }}"
          $port   = "${{ secrets.APP_SERVER_PORT }}"
          $env:GHCR_TOKEN | ssh -i $keyPath -p $port -o StrictHostKeyChecking=accept-new $target "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          if ($LASTEXITCODE -ne 0) { throw "Server GHCR login failed" }
          ssh -i $keyPath -p $port -o StrictHostKeyChecking=accept-new $target "cd /opt/hquizlet && test -f .env && mkdir -p deploy-backups/${{ github.sha }} && cp infra/docker/docker-compose.app.yml infra/nginx/nginx.conf deploy-backups/${{ github.sha }}/"
          if ($LASTEXITCODE -ne 0) { throw "Deployment command failed" }
          scp -i $keyPath -P $port -o StrictHostKeyChecking=accept-new setup-nat-mini.sh "${target}:/opt/hquizlet/setup-nat-mini.sh"
          if ($LASTEXITCODE -ne 0) { throw "Deployment command failed" }
          scp -i $keyPath -P $port -o StrictHostKeyChecking=accept-new infra/docker/docker-compose.app.yml "${target}:/opt/hquizlet/infra/docker/docker-compose.app.yml"
          if ($LASTEXITCODE -ne 0) { throw "Deployment command failed" }
          scp -i $keyPath -P $port -o StrictHostKeyChecking=accept-new infra/nginx/nginx.conf "${target}:/opt/hquizlet/infra/nginx/nginx.conf"
          if ($LASTEXITCODE -ne 0) { throw "Deployment command failed" }
          ssh -i $keyPath -p $port -o StrictHostKeyChecking=accept-new $target "cd /opt/hquizlet && bash setup-nat-mini.sh ${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "Deployment command failed" }
          Remove-Item $keyPath -Force
