[package]
name = "quiz-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic quiz engine: seeded shuffle, scoring, question generation. Pure functions, no I/O, no DB, no HTTP."

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "shuffle_bench"
harness = false
